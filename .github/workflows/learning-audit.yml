name: Finnish Learning Audit

on:
  push:
    paths:
      - "Finnish-Learning-Wiki/**"
      - "engine/**"
      - ".github/workflows/learning-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

# Only one audit may publish Latest_Audit_State.json at a time.
# A later run waits for the current run instead of racing it.
concurrency:
  group: finnish-learning-audit
  cancel-in-progress: false

jobs:
  validate-learning-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run read-only learning audit
        id: audit
        shell: bash
        run: |
          set +e
          python engine/validate_learning_system.py 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Generate persistent audit state
        if: always()
        run: |
          python engine/generate_audit_state.py \
            --log audit.log \
            --exit-code "${{ steps.audit.outputs.exit_code || '1' }}"

      # Keep the generated state outside the Git worktree. This lets us
      # synchronize with the newest main without creating a rebase conflict.
      - name: Preserve generated audit state
        if: always()
        run: cp Finnish-Learning-Wiki/00_System/Latest_Audit_State.json "$RUNNER_TEMP/Latest_Audit_State.json"

      # Publish only after synchronizing with the latest main. The generated
      # state is reapplied on top of origin/main, so concurrent user commits
      # are preserved and Latest_Audit_State.json cannot create a rebase
      # conflict.
      - name: Commit and push audit state
        id: publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          state_file="Finnish-Learning-Wiki/00_System/Latest_Audit_State.json"
          saved_state="$RUNNER_TEMP/Latest_Audit_State.json"

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt/3"
            git fetch origin main

            # Start from current remote main. This preserves commits that
            # arrived while the audit was running.
            git reset --hard origin/main
            cp "$saved_state" "$state_file"

            git add "$state_file"

            if git diff --cached --quiet; then
              echo "No audit-state change to commit"
              exit 0
            fi

            git commit -m "chore: update latest audit state [skip ci]"

            if git push origin HEAD:main; then
              echo "Audit state published successfully"
              exit 0
            fi

            echo "Push raced with a newer main commit; retrying..."
            git reset --hard origin/main
          done

          echo "ERROR: Could not publish audit state after 3 attempts" >&2
          exit 1

      # Telegram is deliberately AFTER successful publication. A failed
      # audit can still be reported, but only after its state is safely saved.
      - name: Send audit report to Telegram
        if: always() && steps.publish.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/send_audit_report_telegram.py --state "$RUNNER_TEMP/Latest_Audit_State.json"
